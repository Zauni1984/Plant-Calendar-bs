[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
validator.workspace = true
shared = { path = "../shared" }
jsonwebtoken.workspace = true
sha2.workspace = true
hex.workspace = true
argon2.workspace = true
rand_core.workspace = true
reqwest.workspace = true
hmac.workspace = true

# Photo pipeline: decode common formats (incl. EXIF orientation), resize, and
# re-encode as lossy WebP. The image crate alone only encodes lossless WebP,
# which for photos is larger than JPEG and would defeat the point.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
webp = "0.3"
# "Download all photos" before the post-subscription deletion: a ZIP built in a
# temp file and streamed, so a large library does not have to fit in memory.
zip = { version = "9", default-features = false }
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
