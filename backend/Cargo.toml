[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
validator.workspace = true
shared = { path = "../shared", features = ["images", "license"] }
jsonwebtoken.workspace = true
sha2.workspace = true
hex.workspace = true
argon2.workspace = true
rand_core.workspace = true
reqwest.workspace = true
hmac.workspace = true

# Photo pipeline: shared::images (feature "images").
# "Download all photos" before the post-subscription deletion: a ZIP built in a
# temp file and streamed, so a large library does not have to fit in memory.
zip = { version = "9", default-features = false }
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
# Web Push reminders (RFC 8030/8291/8292): payload encryption and VAPID
# signing in pure Rust, so the server build needs no OpenSSL.
web-push-native = "0.5"
base64ct = { version = "1", features = ["alloc"] }
