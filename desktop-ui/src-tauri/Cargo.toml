[package]
name = "plants_calendar_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
rusqlite.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
shared = { path = "../../shared" }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow.workspace = true
tokio.workspace = true
btleplug.workspace = true
tokio-stream.workspace = true
tuya-rs.workspace = true
url = "2"
urlencoding = "2"
once_cell = "1"
rand = "0.8"
hex = { workspace = true }

# keyring MUST carry a platform feature. Without one, keyring 3.x silently
# compiles an in-memory mock store: set() reports success, get() works within
# the same process, and the secret is gone on the next launch. That regenerates
# the SQLCipher master key every start and makes the existing encrypted
# database permanently unreadable. Keep these per-target.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
