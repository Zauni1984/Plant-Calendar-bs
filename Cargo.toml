[workspace]
members = [
  "shared",
  "backend",
  "desktop-ui/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-BlockSocial-Proprietary"
authors = ["BlockSocial UG (haftungsbeschränkt) <info@blocksocial.eu>"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "chrono", "uuid", "serde_json"] }
# Note: on Windows host builds, `bundled-sqlcipher-vendored-openssl` requires
# a full Perl distribution (e.g. Strawberry Perl) providing
# Locale::Maketext::Simple to compile OpenSSL from source. macOS and Linux
# build out-of-the-box.
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
btleplug = { version = "0.11", features = ["serde"] }
tokio-stream = "0.1"
tuya-rs = "0.2"
